[package]
name = "gesac"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Multi-host software service, coordinated delivery and recoverable node lifecycle"
repository = "https://github.com/EateralSpirial/General-Enterprise-Service-Architecture-Core"
default-run = "gesac"

[lib]
name = "gesac"

[[bin]]
name = "gesac"
path = "src/main.rs"

[[bin]]
name = "gesac-launcher"
path = "src/bin/gesac-launcher.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
redis = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
rusqlite = { version = "0.38", features = ["bundled"] }
scrypt = "0.11"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.49", features = ["rt-multi-thread", "net", "signal"] }
url = "2"
zeroize = "1"

[profile.release]
lto = false
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0

