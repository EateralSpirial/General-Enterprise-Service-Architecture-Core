[package]
name = "gesac-enterprise"
version = "0.4.0"
edition = "2021"
rust-version = "1.88" # GATE: compiler compatibility
license = "Apache-2.0"

[[bin]]
name = "gesac"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atomic-write-file = "0.3.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
rusqlite = { version = "0.38", features = ["bundled"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies] # GATE: Windows credential backend
windows-dpapi = "0.2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
