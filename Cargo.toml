[package]
name = "gesac"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "General Enterprise Service Architecture Core: signed update and iteration protocol prototype"
repository = "https://github.com/EateralSpirial/General-Enterprise-Service-Architecture-Core"
default-run = "gesac"

[lib]
name = "gesac"

[[bin]]
name = "gesac"
path = "src/main.rs"

[[bin]]
name = "gesac-launcher"
path = "src/bin/gesac-launcher.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
zeroize = "1"

[profile.release]
lto = false
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0

