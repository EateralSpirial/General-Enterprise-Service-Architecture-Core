name: GESAC
on:
  push:
    branches: [main] # GATE: default-branch publication checks
  pull_request:
  workflow_dispatch:
permissions:
  contents: read # GATE: build-only repository permissions
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0 # GATE: compiler compatibility
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # GATE: fixture runtime compatibility
      - run: cargo fmt --check # GATE: formatting acceptance
      - run: cargo clippy --locked --all-targets -- -D warnings # GATE: lint acceptance
      - run: cargo test --release --locked # GATE: isolated deployment acceptance
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: gesac-${{ matrix.os }}
          path: |
            target/release/gesac
            target/release/gesac.exe
