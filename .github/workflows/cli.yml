name: gesac CLI prototype
on:
  push:
    branches: [main]
    paths: ['Cargo.*', 'src/**', 'tests/**', 'tools/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['Cargo.*', 'src/**', 'tests/**', 'tools/**', '.github/workflows/cli.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gesac-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: gesac-${{ matrix.os }}
          path: |
            target/release/gesac
            target/release/gesac.exe
            target/release/gesac-launcher
            target/release/gesac-launcher.exe
  gesac-protocol-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: cargo build --locked
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/e2e.py --bin target/debug/gesac --launcher target/debug/gesac-launcher
